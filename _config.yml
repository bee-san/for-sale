title: "For sale · London"
description: "Bee's personal sale listings. London collection by arrangement."
url: "https://bee-san.github.io"
baseurl: "/for-sale"
markdown: kramdown
theme: null
github_repo: "https://github.com/bee-san/for-sale"
exclude:
  - README.md
  - PRICING.md
  - tests
  - scripts
  - vendor
  - Gemfile
  - Gemfile.lock
collections:
  items:
    output: true
    permalink: /items/:name/
defaults:
  - scope:
      path: ""
      type: items
    values:
      layout: item
      status: available
      currency: "£"

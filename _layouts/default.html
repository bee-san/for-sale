<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <p class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title | escape }}</a></p>
      {% if site.description %}
        <p class="site-description">{{ site.description | escape }}</p>
      {% endif %}
    </header>

    <main class="page-shell">
      {{ content }}
    </main>
  </body>
</html>
